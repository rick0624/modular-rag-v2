[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-v2"
version = "0.1.0"
description = "配置驅動的 RAG 框架:Haystack 2.x 之上的薄層(槽位式 YAML + builder)"
requires-python = ">=3.10"
dependencies = [
    "haystack-ai>=2.31,<3.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# sentence-transformers 元件自 Haystack 2.32 起移出 core,一律從整合套件 import
st = ["sentence-transformers-haystack>=0.1.1,<0.2"]
es = ["elasticsearch-haystack>=6.3,<7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not es'"
markers = [
    "es: 需要執行中的 Elasticsearch(設定 ES_URL 後以 -m es 執行)",
]
