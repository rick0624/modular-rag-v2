# Custom module 示範配置:query_transformation / retrieval / reranking /
# routing / generation / fusion 以及 parsing 鏈中的文件處理器都掛
# examples/custom_modules/ 下的自訂元件(公司系統整合的骨架)。
# ingestion 端(import / parsing 鏈首 / chunking)的 custom 示範另見
# configs/custom_ingestion_demo.yaml。
#
# 完全離線可跑(mock embedding + in_memory + 骨架元件的離線回覆):
#
#   python scripts/run_demo.py --config configs/custom_demo.yaml --trace
#
# custom retrieval 不吃本地索引,所以這份 config 也可以只跑 inference:
#
#   python scripts/run_demo.py --config configs/custom_demo.yaml --stage inference
#
# 注意:custom module 的 file 路徑相對於「執行目錄」(repo 根)解析,
# 不是 config 檔的位置。到公司整合時,把這幾支 .py 裡標了
# 「TODO(替換點)」的函式換成真正的邏輯即可,其餘串接不用動。

ingestion:
  # custom retrieval 不查本地索引(範例直接回模擬資料;正式版走公司 ES
  # 的 HTTP API),但 config 仍需 ingestion 區塊提供 embedding / indexing
  # 設定(建構期的 BuildContext 依賴)。這裡用全離線的最小組合;
  # 語料實際上不會被 custom retrieval 用到。
  import:
    method: local_file
    method_params:
      local_file:
        input_dir: ./data/raw
        extensions: [".txt", ".md"]
  parsing:                          # custom 也能放進 parsing 鏈(鏈中 =
    method: [plain_text, custom]    # 文件處理器,契約 documents → documents)
    method_params:
      plain_text: {}
      custom:
        file: examples/custom_modules/company_parser.py
        class: CompanyBoilerplateCleaner
        # kind: doc_processor       # 預設;鏈首 converter 見 custom_ingestion_demo
        # init_params:
        #   patterns: [本文件為公司內部機密]
  chunking:
    method: fixed_size
    method_params:
      fixed_size:
        split_length: 300
        split_overlap: 50
  embedding:
    method: mock
    method_params:
      mock:
        dim: 32
  indexing:
    method: in_memory

inference:
  query_transformation:             # custom 可放在方法鏈中(這裡接在 normalize 後)
    method: [normalize, custom]     # 契約:queries: list[str] → queries: list[str]
    method_params:
      normalize:
        lowercase: true
      custom:
        file: examples/custom_modules/company_query_transform.py
        class: CompanyQueryExpander
        init_params:
          max_queries: 3
          # synonyms:               # 不設定時用範例內建詞庫
          #   請假: 請假 差勤申請

  retrieval:
    method: custom                  # 契約:query: str → documents: list[Document]
    method_params:
      custom:
        file: examples/custom_modules/company_retrieval.py
        class: CompanyRetriever
        init_params:
          top_k: 5
          # endpoint: https://km.example.com/api/search   # 接真服務時設定

  reranking:
    method: custom                  # 契約:query + documents → documents
    method_params:
      custom:
        file: examples/custom_modules/company_reranker.py
        class: KeywordOverlapReranker
        init_params:
          top_k: 3

  generation:
    method: custom                  # 契約:messages: list[ChatMessage]
    method_params:                  #      → replies: list[ChatMessage]
      custom:
        file: examples/custom_modules/company_generator.py
        class: CompanyLLMGenerator
        # prompt 仍由框架組(這兩個選項與內建方法同款):
        system_prompt: 你是公司內部知識庫的助理,只根據提供的內容回答。
        # prompt_template: |        # 不設定時用內建模板
        #   ...
        init_params:
          model: company-llm-v1
          # endpoint: https://llm.example.com/v1/completions  # 設了就走真服務
                                    # OpenAI 相容的閘道不必寫 custom,
                                    # 直接用 gateway_openai_compatible(見 company.yaml)

  fusion:
    method: custom                  # 契約:results: list[list[Document]]
    params:                         #      → documents: list[Document]
      # (fusion 槽位只支援 params,無 method_params 分區)
      file: examples/custom_modules/company_fusion.py
      class: CompanyFusion
      init_params:
        top_k: 3
    # 注意:掛了 custom 就一律執行(單一查詢也進元件);內建融合改寫
    # group_by / strategy / top_k(不可與 method: custom 混用)

  formatter:                        # 選填終端支線:最終結果組成對外格式,
    method: custom                  # 進 query() 輸出的 output 鍵(省略 = None)
    method_params:                  # 契約:documents + query → payload: Any
      custom:
        file: examples/custom_modules/company_formatter.py
        class: CompanyResponseBuilder
        # init_params:
        #   include_content: true

  routing:                          # 獨立支線:判斷類別,不影響檢索
    method: custom                  # 契約:query: str → route: dict
    method_params:
      custom:
        file: examples/custom_modules/company_router.py
        class: CompanyQuestionRouter
        # init_params:
        #   rules:                  # 不設定時用範例內建規則
        #     人資/差勤: [請假, 特休, 薪資]
        #   default_category: 其他
