# 本機開發環境配置:OpenAI embeddings + 本機 Elasticsearch + OpenAI 生成。
# 方法與參數的完整型錄請見 configs/default.yaml(本檔只列啟用的組合)。
#
#   cp .env.example .env          # 填入 OPENAI_API_KEY
#   docker compose up -d          # 本機 ES(或指向既有叢集)
#   python scripts/run_demo.py --config configs/home.yaml
#
# 需要的環境變數:OPENAI_API_KEY
#
# configs/condense.yaml 與本檔共用同一個索引(embedding 模型與切塊設定
# 相同),ingest 過一次即可互相沿用。

ingestion:
  import:
    method: local_file
    method_params:
      local_file:
        input_dir: ./data/raw
        extensions: [".txt", ".md"] # 釘住純文字:parsing 用 plain_text 才合法

  parsing:
    method: plain_text              # 含 PDF 的語料改:extensions 放開、這裡換 auto

  chunking:
    method: fixed_size
    method_params:
      fixed_size:
        split_length: 300
        split_overlap: 50

  embedding:
    method: api_embedding           # OpenAI embeddings API(OpenAI 式回應)
    method_params:
      api_embedding:
        endpoint: https://api.openai.com/v1/embeddings
        headers:
          Authorization: Bearer ${OPENAI_API_KEY}
        model: text-embedding-3-small
        batch_size: 16
        embeddings_field: data      # {"data": [{"embedding": [...]}]} 形狀
        item_field: embedding
      mock:                         # 離線試跑備援(切 method 即換)
        dim: 64

  indexing:
    method: elasticsearch           # 向量 + BM25 + filter 都在 ES 伺服器端
    method_params:
      elasticsearch:
        hosts: http://localhost:9200
        # 索引名帶上 embedding 模型:ES 的 dense_vector dims 建立後不可
        # 變更,換模型/維度就得換索引(或先刪掉重建)。
        index: modular-rag-openai-small

inference:
  query_transformation:
    method: normalize
    method_params:
      normalize:
        lowercase: true

  retrieval:
    method: hybrid                  # ES BM25 + kNN,RRF 融合
    method_params:
      hybrid:
        top_k: 5

  reranking:
    method: none

  generation:
    method: openai                  # 官方 OpenAI;api_key 取自 OPENAI_API_KEY
    method_params:
      openai:
        model: gpt-5-nano
      mock: {}                      # 離線試跑備援(切 method 即換)

evaluation:
  method: basic_retrieval_metrics
  params:
    dataset_path: ./data/eval/qa.jsonl
