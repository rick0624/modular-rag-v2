# 公司環境配置:Elasticsearch + 公司 embedding API + 公司 LLM 閘道。
#
# 機密一律以 ${ENV_VAR} 注入:複製 .env.example 為 .env 填入金鑰即可,
# 設定檔可以安心進版控。
#
#   cp .env.example .env
#   docker compose up -d          # 或指向既有的 ES 叢集
#   python scripts/run_demo.py --config configs/company.yaml
#
# 需要的環境變數:ES_URL、COMPANY_EMBEDDING_API_KEY、COMPANY_LLM_API_KEY
# ES 叢集有開 security 時另需認證(見下方 indexing.params 註解)。

ingestion:
  import:
    method: local_file
    method_params:
      local_file:
        input_dir: ./data/raw
        extensions: [".txt", ".md"] # 釘住純文字:parsing 用 plain_text 才合法

  parsing:
    method: plain_text              # 含 PDF 的語料改:extensions 放開、這裡換 auto

  chunking:
    method: fixed_size
    method_params:
      fixed_size:
        split_length: 300
        split_overlap: 50

  embedding:
    method: api_embedding           # 公司 embedding API(OpenAI 式回應)
    method_params:
      api_embedding:
        endpoint: https://your-company-api.example.com/v1/embeddings
        headers:
          Authorization: Bearer ${COMPANY_EMBEDDING_API_KEY}
        model: your-embedding-model # 閘道不接受 model 欄位時,刪掉此行即可
        batch_size: 16
        embeddings_field: data      # {"data": [{"embedding": [...]}]} 形狀
        item_field: embedding
      sentence_transformers:        # 本地模型備援(切 method 即換)
        model_name: sentence-transformers/all-MiniLM-L6-v2

  indexing:
    method: elasticsearch           # 向量 + BM25 + filter 都在 ES 伺服器端
    method_params:
      elasticsearch:
        hosts: ${ES_URL}
        index: modular-rag-company
        # 公司叢集通常開著 security:沒帶憑證會收到
        #   401 security_exception: missing authentication credentials
        # 取消註解其中一組(擇一),並在 .env 補上對應變數:
        # username: ${ES_USERNAME}
        # password: ${ES_PASSWORD}
        # api_key: ${ES_API_KEY}
        # https 且憑證由私有 CA 簽發時,另外指定 CA:
        # ca_certs: ${ES_CA_CERTS}

inference:
  query_transformation:
    method: [normalize, llm_decompose]   # 先正規化,再 LLM 拆解子查詢
    method_params:
      normalize:
        lowercase: true
      llm_decompose:
        max_subqueries: 3
        # 未指定 generator:沿用下方 generation 槽位的公司閘道

  retrieval:
    method: hybrid                  # ES BM25 + kNN,RRF 融合
    method_params:
      hybrid:
        top_k: 10

  reranking:
    method: [similarity, llm]       # 雙段:cross-encoder 收斂 → LLM 精排
    #
    # 改用公司的 rerank API:把上面那行換成
    #     method: api_rerank
    # (或串成 [api_rerank, llm_fact_check]),取消下方 api_rerank 區塊的
    # 註解,並在 .env 補上 COMPANY_RERANK_API_KEY。
    # ${ENV_VAR} 在載入時就展開,未啟用的區塊也會檢查 —— 所以整段
    # 註解掉而不是留在那裡。
    method_params:
      similarity:                   # 需安裝:pip install -e ".[st]"
        model: cross-encoder/ms-marco-MiniLM-L-6-v2
        top_k: 10
      # api_rerank:                 # 公司 rerank API(取代本地 cross-encoder)
      #   endpoint: https://your-company-rerank.example.com/v1/rerank
      #   headers:
      #     Authorization: Bearer ${COMPANY_RERANK_API_KEY}
      #   model: your-rerank-model  # 閘道不接受 model 欄位時,刪掉此行即可
      #   top_k: 5
      #   # 預設請求 {question, documents, model}、回應
      #   # {"returnData": [{"index", "score"}]};形狀不同時用
      #   # query_field / results_field / index_field / score_field 對應,
      #   # index 從 1 起算的 API 另設 index_base: 1(見 configs/default.yaml)
      llm:
        top_k: 5
        # 未指定 generator:沿用 generation 槽位的公司閘道

  generation:
    method: gateway_openai_compatible
    method_params:
      gateway_openai_compatible:
        base_url: https://your-company-llm.example.com/v1
        api_key: ${COMPANY_LLM_API_KEY}
        # model 刻意不設定:公司閘道不接受 model 欄位,請求將不帶該欄位
        system_prompt: 只根據提供的內容回答問題;內容不足時明確說明無法回答。
        temperature: 0.2
        # max_tokens: 1024
      mock: {}                      # 離線試跑備援(切 method 即換)

  fusion:
    group_by: doc                   # 子查詢結果按文件聚合
    strategy: rrf
    top_k: 5

evaluation:
  method: basic_retrieval_metrics
  params:
    dataset_path: ./data/eval/qa.jsonl
